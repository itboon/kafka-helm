{{- if .Values.broker.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.broker.fullname" . }}-sasl
  namespace: {{ include "kafka.namespace" $ }}
  labels:
    {{- include "kafka.labels" $ | nindent 4 }}
    app.kubernetes.io/component: broker
type: Opaque
data:
  {{- range .Values.broker.auth.users }}
  {{ .username }}: {{ .password | b64enc | quote }}
  {{- end }}
{{- end }}