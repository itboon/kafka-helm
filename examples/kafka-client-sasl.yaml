# Kafka 客户端 SASL SCRAM 认证示例
# 用于测试 Kafka SASL SCRAM 认证连接

apiVersion: v1
kind: Pod
metadata:
  name: kafka-client-sasl
  labels:
    app: kafka-client-sasl
spec:
  containers:
  - name: kafka-client
    image: kafkace/kafka:v3.7.1-63ba8d2
    command:
      - sleep
      - "3600"
    env:
    - name: KAFKA_HEAP_OPTS
      value: "-Xms256m -Xmx256m"
    volumeMounts:
    - name: client-config
      mountPath: /etc/kafka/client
  volumes:
  - name: client-config
    configMap:
      name: kafka-client-sasl-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-client-sasl-config
data:
  client.properties: |
    bootstrap.servers=kafka-sasl-broker:9092
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=SCRAM-SHA-256
    sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka" password="Kafka@2025";
  
  producer.properties: |
    bootstrap.servers=kafka-sasl-broker:9092
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=SCRAM-SHA-256
    sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka" password="Kafka@2025";
    key.serializer=org.apache.kafka.common.serialization.StringSerializer
    value.serializer=org.apache.kafka.common.serialization.StringSerializer
  
  consumer.properties: |
    bootstrap.servers=kafka-sasl-broker:9092
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=SCRAM-SHA-256
    sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka" password="Kafka@2025";
    key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
    value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
    group.id=test-consumer-group
    auto.offset.reset=earliest