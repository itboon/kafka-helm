apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-controller1
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName:
  claimRef:
    name: data-kafka-ha-controller-0
    namespace: default
  local:
    path: /data/controller
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - master01
